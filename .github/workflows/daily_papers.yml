name: Daily Papers Digest

on:
  schedule:
    - cron: "0 13 * * *"   # 매일 UTC 13:00 = KST 22:00 (HF가 오늘 papers + 반나절치 upvote 누적된 시점)
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      retag:
        description: "기존 논문 재태깅 (이번 달 전체)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily digest
        if: ${{ github.event.inputs.retag != 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/daily_digest.py

      - name: Retag existing papers (this month)
        if: ${{ github.event.inputs.retag == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/retag_papers.py --days 31
